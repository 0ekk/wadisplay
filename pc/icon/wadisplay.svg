      <rect width="32" height="32" fill="#fff"/>
      <rect x="18" y="6" width="16" height="28" rx="3" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#behind-tablet)" fill="#64748b">
    <rect x="0" y="4" width="24" height="16" rx="2"/>
    <rect x="10" y="20" width="4" height="4"/>
    <rect x="6" y="24" width="12" height="2" rx="1"/>
    <rect x="2" y="6" width="20" height="12" fill="#3b82f6"/>
  </g>
  <rect x="20" y="8" width="12" height="22" rx="2" fill="#64748b"/>
  <rect x="22" y="10" width="8" height="18" fill="#14b8a6"/>
  <path d="M23.5 12.5v11l2.6-2.4 1.9 4.1 1.8-.8-1.9-4h3.6z" fill="#fff" stroke="#0f172a" stroke-width="1" stroke-linejoin="round"/>
