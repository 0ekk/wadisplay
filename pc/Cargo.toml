[package]
name = "wadisplay-pc"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

# Tests live in the lib: a bin test harness would get the requireAdministrator manifest.
[[bin]]
name = "wadisplay"
path = "src/main.rs"
test = false

[dependencies]
wadisplay-proto = { path = "../proto" }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
